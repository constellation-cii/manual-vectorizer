# DigitalOcean App Platform — https://docs.digitalocean.com/products/app-platform/
name: manual-vectorizer
region: nyc

features:
  - buildpack-stack=ubuntu-22

databases:
  - name: db
    engine: PG
    version: "16"

domains:
  - domain: www.vulcanpl.org
    type: PRIMARY
  - domain: vulcanpl.org
    type: ALIAS

services:
  - name: web
    environment_slug: ruby
    github:
      repo: constellation-cii/manual-vectorizer
      branch: main
      deploy_on_push: true
    source_dir: /
    run_command: bundle exec puma -C config/puma.rb
    http_port: 8080
    health_check:
      failure_threshold: 6
      http_path: /up
      initial_delay_seconds: 20
      period_seconds: 10
      success_threshold: 1
      timeout_seconds: 5
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: RACK_ENV
        scope: RUN_TIME
        value: production
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: BOOTSTRAP_TOKEN
        scope: RUN_TIME
        type: SECRET

ingress:
  rules:
    - component:
        name: web
      match:
        path:
          prefix: /

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
