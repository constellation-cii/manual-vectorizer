<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log — Manual Vectorizer</title>
  <link rel="stylesheet" href="css/app.css?v=2" />
</head>
<body>
  <header>
    <h1>Manual Vectorizer</h1>
    <nav>
      <a href="/">Vectorize</a>
      <a href="/weights.html">Weights</a>
      <a href="/results.html">Results</a>
      <a href="/edit.html">Edit</a>
      <a href="/log.html" class="active">Log</a>
    </nav>
  </header>

  <main class="editor-page">
    <section class="log-save-panel">
      <h2>Save current ranking</h2>
      <form id="save-log-form" class="auth-form">
        <label>Speaker <input type="text" name="speaker_name" id="speaker_name" required /></label>
        <label>Source reference <input type="text" name="source_ref" id="source_ref" placeholder="URL, book, notes…" /></label>
        <label>Notes <textarea name="notes" id="notes" rows="2"></textarea></label>
        <button type="submit" class="btn btn-primary">Save to log</button>
      </form>
      <p id="save-status" class="auth-success" hidden>Saved.</p>
    </section>

    <section>
      <h2>Log entries</h2>
      <table class="log-table">
        <thead><tr><th>Speaker</th><th>Source</th><th>Created</th><th>Share</th><th></th></tr></thead>
        <tbody id="log-rows"></tbody>
      </table>
    </section>

    <section>
      <h2>Shared with me</h2>
      <ul id="shared-list"></ul>
    </section>
  </main>

  <script type="module" src="js/auth-nav.js"></script>
  <script type="module" src="js/log.js"></script>
</body>
</html>
